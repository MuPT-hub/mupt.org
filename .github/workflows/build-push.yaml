name: Build Hugo site from push

on: 
  push:
    branches:
      - main
  # SCHEDULE AND WORKFLOW DISPATCH ARE FOR TESTING
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  HUGO_VERSION: "0.166.0"
  HUGO_SOURCE_DIR: "."
  HUGO_BASE_URL: ""
  HUGO_OUTPUT_DIR: "public"

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Check team images
        run: pixi run check-team-images

      - name: Build site
        uses: dwhswenson/static-site-tools/build/hugo@update-hugo-action
        #uses: omsf/static-site-tools/build/hugo@main  # restore after upstream PR merges
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          update-modules: "false"
          base-url: ${{ env.HUGO_BASE_URL }}
          source-directory: ${{ env.HUGO_SOURCE_DIR }}
          output-directory: ${{ env.HUGO_OUTPUT_DIR }}

      - name: Make artifact
        shell: bash
        run: tar czf site.tar.gz -C ${{ env.HUGO_SOURCE_DIR }} ${{ env.HUGO_OUTPUT_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 1
