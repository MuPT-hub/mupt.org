baseURL = 'https://mupt.org/'
languageCode = 'en-us'
title = 'The Multiscale Polymer Toolkit (MuPT)'

[[module.imports]]
path = 'github.com/StefMa/hugo-fresh'

[params]
description = 'A collaborative infrastructure for understanding structure-function relationships in polymers with multiscale molecular modeling and simulations.'
preloader = false

[[params.navbar]]
title = 'Team'
url = '/team/'

# Main content from https://github.com/MuPT-hub/.github/blob/main/profile/README.md
# Use the theme's hero and navigation configuration, with a second CTA
# supported by layouts/partials/hero-body.html.
[params.hero]
title = 'The Multiscale Polymer Toolkit (MuPT)'
subtitle = 'The multiscale polymer toolkit is a collaborative infrastructure to expand the ability of the polymer research community to understand structure-function relationships in polymers with multiscale molecular modeling and simulations.'
image = 'mupt-toolkit.png'
buttontext = 'Documentation'
buttonlink = 'https://mupt.readthedocs.io'
secondarybuttontext = 'GitHub'
secondarybuttonlink = 'https://github.com/MuPT-hub'

